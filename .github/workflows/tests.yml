name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e '.[dev,figures]'
      - run: python -m pytest tests -q
      - run: python examples/make_sample.py --output work/source
      - run: python scripts/prepare_images.py --pages-dir work/source --output work/prepared --pages 1 --max-pixels 2000000
      - run: python scripts/check_environment.py --mode extract
      - run: python scripts/package_skill.py --output work/pdf-extract.zip
